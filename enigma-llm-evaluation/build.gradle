plugins {
	id 'enigma.frontier-evaluation'
}

dependencies {
	// The evaluation harness intentionally uses the same Java package as :enigma-llm-plugin
	// so it can exercise package-private plugin internals without widening the production API.
	// This relies on the current flat classpath build: no module-info.java and no relocation.
	implementation project(':enigma')
	implementation project(':enigma-llm-plugin')

	implementation 'org.ow2.asm:asm:9.9.1'
	implementation 'org.ow2.asm:asm-tree:9.9.1'

	// Benchmark-only: tiny-remapper applies the ground-truth rename map to produce the obfuscated
	// corpus jars. It stays in this evaluation project and never ships in the production plugin jar.
	implementation 'net.fabricmc:tiny-remapper:0.12.0'
}

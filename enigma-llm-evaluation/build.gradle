import net.fabricmc.loom.util.download.Download
import groovy.json.JsonSlurper
import java.util.zip.ZipFile

buildscript {
	repositories {
		mavenCentral()
		maven { url = 'https://maven.fabricmc.net/' }
	}
	dependencies {
		// Reuse FabricMC/Loom's battle-tested downloader (sha1 verification, ETag
		// caching, retries) instead of hand-rolling HTTP. MIT-licensed; used here as a
		// plain library on the buildscript classpath, NOT applied as a Gradle plugin.
		// Pinned to the last 1.6.x release, which still targets Java 17 (the JVM this
		// build uses). Newer loom (1.8+) hard-requires Java 21; bumping the whole build's
		// toolchain just for a download helper would be a risky cross-cutting change.
		classpath 'net.fabricmc:fabric-loom:1.6.12'
	}
}

configurations {
	minecraftIntermediaryMappings {
		canBeConsumed = false
		canBeResolved = true
		transitive = false
	}
	minecraftYarnMappings {
		canBeConsumed = false
		canBeResolved = true
		transitive = false
	}
}

dependencies {
	// The evaluation harness intentionally uses the same Java package as :enigma-llm-plugin
	// so it can exercise package-private plugin internals without widening the production API.
	// This relies on the current flat classpath build: no module-info.java and no relocation.
	implementation project(':enigma')
	implementation project(':enigma-llm-plugin')

	implementation 'org.ow2.asm:asm:9.9.1'
	implementation 'org.ow2.asm:asm-tree:9.9.1'

	// Benchmark-only: tiny-remapper applies the ground-truth rename map to produce the obfuscated
	// corpus jars. It stays in this evaluation project and never ships in the production plugin jar.
	implementation 'net.fabricmc:tiny-remapper:0.12.0'

	def minecraftVersion = project.findProperty('mcVersion') ?: '1.21.11'
	def yarnMappingsVersion = project.findProperty('mcYarnVersion') ?: "${minecraftVersion}+build.6"
	minecraftIntermediaryMappings "net.fabricmc:intermediary:${minecraftVersion}:v2"
	minecraftYarnMappings "net.fabricmc:yarn:${yarnMappingsVersion}:v2"
}

// The root build applies maven-publish to every subproject. This project is a local
// benchmark harness with unpublished evaluation artifacts, so keep publication disabled
// even though the plugin-created lifecycle tasks still exist.
tasks.withType(org.gradle.api.publish.maven.tasks.PublishToMavenRepository).configureEach {
	enabled = false
}
tasks.withType(org.gradle.api.publish.maven.tasks.PublishToMavenLocal).configureEach {
	enabled = false
}
tasks.matching {
	it.name in ['publish', 'publishToMavenLocal', 'publishAllPublicationsToMavenLocalRepository']
}.configureEach {
	enabled = false
}

// Ground-truth OSS corpus for the Hybrid 1.1 deobfuscation round-trip benchmark.
// The jars ship real, human-authored names; the obfuscation pipeline renames them to
// opaque tokens and the LLM is scored on how well it recovers the originals. Jars are
// downloaded on demand (git-ignored, never committed) and pinned by sha1 so a matching
// local copy is reused without re-downloading. Fame is deliberately mixed to separate
// genuine context recovery from memorization of well-known APIs; results are reported
// per-jar for exactly that reason.
def corpusDir = file("${project.projectDir}/evaluation/corpus")
def corpus = [
		[name: 'gson-2.11.0.jar',
		 url : 'https://repo1.maven.org/maven2/com/google/code/gson/gson/2.11.0/gson-2.11.0.jar',
		 sha1: '527175ca6d81050b53bdd4c457a6d6e017626b0e'],
		[name: 'commons-lang3-3.14.0.jar',
		 url : 'https://repo1.maven.org/maven2/org/apache/commons/commons-lang3/3.14.0/commons-lang3-3.14.0.jar',
		 sha1: '1ed471194b02f2c6cb734a0cd6f6f107c673afae'],
		[name: 'xz-1.9.jar',
		 url : 'https://repo1.maven.org/maven2/org/tukaani/xz/1.9/xz-1.9.jar',
		 sha1: '1ea4bec1a921180164852c65006d928617bd2caf'],
]

tasks.register('downloadCorpus') {
	group = 'verification'
	description = 'Downloads the OSS ground-truth corpus jars for the deobfuscation benchmark (git-ignored).'
	outputs.files(corpus.collect { new File(corpusDir, it.name) })
	doLast {
		corpusDir.mkdirs()
		corpus.each { entry ->
			def target = new File(corpusDir, entry.name).toPath()
			Download.create(entry.url)
					.sha1(entry.sha1)
					.maxRetries(3)
					.downloadPath(target)
			logger.lifecycle("corpus: ${entry.name} ready (${java.nio.file.Files.size(target)} bytes)")
		}
	}
}

tasks.register('obfuscateCorpus', JavaExec) {
	group = 'verification'
	description = 'Obfuscates the downloaded corpus jars with tiny-remapper and emits ground-truth jsonl.'
	dependsOn 'downloadCorpus'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'cuchaz.enigma.llm.ObfuscateCorpusTool'
	args = [
			corpusDir.path,
			file("${project.buildDir}/llm-evaluation/obfuscated").path
	]
}

def minecraftVersion = project.findProperty('mcVersion') ?: '1.21.11'
def minecraftInputDir = layout.buildDirectory.dir("llm-evaluation/minecraft-inputs/${minecraftVersion}")

def extractTiny = { File jarFile, File outputFile ->
	outputFile.parentFile.mkdirs()
	new ZipFile(jarFile).withCloseable { zip ->
		def entry = zip.getEntry('mappings/mappings.tiny')
		if (entry == null) {
			throw new GradleException("No mappings/mappings.tiny in ${jarFile}")
		}
		zip.getInputStream(entry).withCloseable { input ->
			outputFile.withOutputStream { output -> output << input }
		}
	}
}

tasks.register('prepareMinecraftInputs') {
	group = 'verification'
	description = 'Downloads Minecraft client, Mojmap, Intermediary, Yarn and Parchment inputs for the Minecraft benchmark.'
	notCompatibleWithConfigurationCache('Downloads and resolves external Minecraft/Fabric/Parchment inputs at execution time.')

	def inputDir = minecraftInputDir.get().asFile
	def versionManifest = new File(inputDir, 'version_manifest_v2.json')
	def versionJson = new File(inputDir, "${minecraftVersion}.json")
	def clientJar = new File(inputDir, "minecraft-${minecraftVersion}-client.jar")
	def mojmapTxt = new File(inputDir, "mojmap-client-${minecraftVersion}.txt")
	def intermediaryTiny = new File(inputDir, "intermediary-${minecraftVersion}.tiny")
	def yarnTiny = new File(inputDir, "yarn-${minecraftVersion}.tiny")
	def parchmentFile = new File(inputDir, "parchment-${minecraftVersion}.zip")
	def intermediaryMappingFile = configurations.minecraftIntermediaryMappings.elements.map { it.iterator().next().asFile }
	def yarnMappingFile = configurations.minecraftYarnMappings.elements.map { it.iterator().next().asFile }
	def parchmentVersion = project.findProperty('mcParchmentVersion') ?: '2025.12.20'

	outputs.files(versionManifest, versionJson, clientJar, mojmapTxt, intermediaryTiny, yarnTiny, parchmentFile)

	doLast {
		inputDir.mkdirs()
		Download.create('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json')
				.maxRetries(3)
				.downloadPath(versionManifest.toPath())

		def manifest = new JsonSlurper().parse(versionManifest)
		def versionEntry = manifest.versions.find { it.id == minecraftVersion }
		if (versionEntry == null) {
			throw new GradleException("Minecraft version ${minecraftVersion} not found in Mojang version manifest")
		}

		Download.create(versionEntry.url)
				.maxRetries(3)
				.downloadPath(versionJson.toPath())

		def versionData = new JsonSlurper().parse(versionJson)
		def client = versionData.downloads.client
		def clientMappings = versionData.downloads.client_mappings
		Download.create(client.url)
				.sha1(client.sha1)
				.maxRetries(3)
				.downloadPath(clientJar.toPath())
		Download.create(clientMappings.url)
				.sha1(clientMappings.sha1)
				.maxRetries(3)
				.downloadPath(mojmapTxt.toPath())

		File intermediaryMappingJar = intermediaryMappingFile.get()
		File yarnMappingJar = yarnMappingFile.get()
		extractTiny(intermediaryMappingJar, intermediaryTiny)
		extractTiny(yarnMappingJar, yarnTiny)

		Download.create("https://maven.parchmentmc.org/org/parchmentmc/data/parchment-${minecraftVersion}/${parchmentVersion}/parchment-${minecraftVersion}-${parchmentVersion}.zip")
				.maxRetries(3)
				.downloadPath(parchmentFile.toPath())

		logger.lifecycle("minecraft inputs ready in ${inputDir}")
		logger.lifecycle("intermediary=${intermediaryMappingJar.name}, yarn=${yarnMappingJar.name}")
	}
}

tasks.register('buildMinecraftCorpus', JavaExec) {
	group = 'verification'
	description = 'Builds the Minecraft full-corpus benchmark from downloaded Mojang/Fabric/Parchment mappings.'
	dependsOn 'prepareMinecraftInputs'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'cuchaz.enigma.llm.MinecraftCorpusTool'

	def inputDir = minecraftInputDir.get().asFile
	def mcJarArg = file(project.findProperty('mcJar') ?: new File(inputDir, "minecraft-${minecraftVersion}-client.jar"))
	def intermediaryTinyArg = file(project.findProperty('mcIntermediaryTiny') ?: new File(inputDir, "intermediary-${minecraftVersion}.tiny"))
	def yarnMappingsArg = file(project.findProperty('mcYarnMappings') ?: new File(inputDir, "yarn-${minecraftVersion}.tiny"))
	def mojmapArg = file(project.findProperty('mcMojmap') ?: new File(inputDir, "mojmap-client-${minecraftVersion}.txt"))
	def parchmentArg = file(project.findProperty('mcParchment') ?: new File(inputDir, "parchment-${minecraftVersion}.zip"))
	def outputArg = project.hasProperty('mcOut')
			? file(project.property('mcOut'))
			: file("${project.buildDir}/llm-evaluation/minecraft")
	def baseArg = project.findProperty('mcBase') ?: "minecraft-${minecraftVersion}"

	inputs.files(mcJarArg, intermediaryTinyArg, mojmapArg, parchmentArg)
	inputs.files(yarnMappingsArg)
	outputs.dir(outputArg)

	args = [
			mcJarArg.path,
			intermediaryTinyArg.path,
			yarnMappingsArg.path,
			mojmapArg.path,
			parchmentArg.path,
			outputArg.path,
			baseArg
	]
}

tasks.register('benchmarkMinecraftCorpus', JavaExec) {
	group = 'verification'
	description = 'Runs the LLM obfuscation benchmark over a downloaded/built Minecraft corpus profile.'
	dependsOn 'buildMinecraftCorpus'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'cuchaz.enigma.llm.LlmObfuscationBenchmarkHarness'

	def profile = (project.findProperty('mcProfile') ?: 'union').toString().toLowerCase(Locale.ROOT)
	if (!['yarn', 'mojmap', 'union'].contains(profile)) {
		throw new GradleException("mcProfile must be one of yarn, mojmap, union; got ${profile}")
	}

	def obfDirArg = file("${project.buildDir}/llm-evaluation/minecraft/${profile}")
	def resultsDirArg = project.hasProperty('mcResultsDir')
			? file(project.property('mcResultsDir'))
			: file("${project.buildDir}/llm-evaluation/minecraft-benchmark/${profile}")
	args = [obfDirArg.path, resultsDirArg.path]

	if (project.hasProperty('limit')) {
		environment 'ENIGMA_LLM_BENCH_LIMIT', project.property('limit')
	}
	if (project.hasProperty('mcDumpPrompts')) {
		environment 'ENIGMA_LLM_DUMP_PROMPTS', file(project.property('mcDumpPrompts')).path
	}
	if (project.hasProperty('mcCode')) {
		environment 'ENIGMA_LLM_BENCH_CODE', project.property('mcCode')
	}
	if (project.hasProperty('mcCodeControl')) {
		environment 'ENIGMA_LLM_BENCH_CODE_CONTROL', project.property('mcCodeControl')
	}
	if (project.hasProperty('mcCodeControlSeed')) {
		environment 'ENIGMA_LLM_BENCH_CODE_CONTROL_SEED', project.property('mcCodeControlSeed')
	}
	if (project.hasProperty('maxPromptChars')) {
		environment 'ENIGMA_LLM_MAX_PROMPT_CHARS', project.property('maxPromptChars')
	}
}

tasks.register('benchmarkObfuscation', JavaExec) {
	group = 'verification'
	description = 'Phase A: drives the real suggestion engine over the obfuscated corpus and scores name recovery vs ground truth.'
	dependsOn 'obfuscateCorpus'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'cuchaz.enigma.llm.LlmObfuscationBenchmarkHarness'
	// Optional -PobfDir / -PresultsDir override the input corpus dir and output dir (e.g. a DEV subset
	// with only some jars for the 7B tuning loop); default to the full obfuscated corpus + benchmark dir.
	def obfDirArg = project.hasProperty('obfDir') ? file(project.property('obfDir')).path : file("${project.buildDir}/llm-evaluation/obfuscated").path
	def resultsDirArg = project.hasProperty('resultsDir') ? file(project.property('resultsDir')).path : file("${project.buildDir}/llm-evaluation/benchmark").path
	args = [obfDirArg, resultsDirArg]
	// Sample N targets per jar (deterministic stride) for a cheap smoke run: -Plimit=25.
	// The engine reads its endpoint/model from ENIGMA_LLM_* env vars; with none set the harness
	// still runs the structural half (open + index + resolve every key).
	if (project.hasProperty('limit')) {
		environment 'ENIGMA_LLM_BENCH_LIMIT', project.property('limit')
	}
}

def codexPromptDumpRoot = file(project.findProperty('codexPromptDumpRoot') ?: "${project.buildDir}/llm-evaluation/codex-prompt-dumps")
def codexPromptBatchRoot = file(project.findProperty('codexPromptBatchRoot') ?: "${project.buildDir}/llm-evaluation/prompt-batches")
def codexPromptPrepMarker = '.codex-prompt-prep-owned'

def containsCodexModelOutputs = { File dir ->
	if (!dir.exists()) {
		return false
	}
	def found = false
	java.nio.file.Files.walk(dir.toPath()).withCloseable { stream ->
		def iterator = stream.iterator()
		while (!found && iterator.hasNext()) {
			def path = iterator.next()
			if (!java.nio.file.Files.isRegularFile(path) || !path.fileName.toString().endsWith('.json')) {
				continue
			}
			String text = java.nio.file.Files.readString(path)
			found = text.contains('"requestedModel"') || text.contains('"latencyMs"') ||
					(text.contains('"ok"') && text.contains('"suggestedName"'))
		}
	}
	return found
}

def resetCodexGeneratedDir = { File dir, String label ->
	File target = dir.canonicalFile
	File buildEval = file("${project.buildDir}/llm-evaluation").canonicalFile
	boolean underBuildEval = target.path == buildEval.path || target.path.startsWith(buildEval.path + File.separator)
	File marker = new File(target, codexPromptPrepMarker)
	if (target.exists()) {
		if (containsCodexModelOutputs(target) && !project.hasProperty('codexPromptDeleteModelOutputs')) {
			throw new GradleException("Refusing to delete ${label} at ${target}: it appears to contain Codex model outputs. " +
					"Move them, choose another output directory, or pass -PcodexPromptDeleteModelOutputs=true if this is intentional.")
		}
		if (!underBuildEval && !marker.exists() && !project.hasProperty('codexPromptOverwriteUnmarked')) {
			throw new GradleException("Refusing to delete unmarked ${label} outside build/llm-evaluation: ${target}. " +
					"Use a fresh directory or pass -PcodexPromptOverwriteUnmarked=true after checking its contents.")
		}
		project.delete(target)
	}
	target.mkdirs()
	marker.text = "Owned by prepareCodexPromptBatches; safe to regenerate prompt dumps/batches here.\n"
}

def configureCodexPromptDump = { JavaExec task, File dumpDir, File resultsDir, boolean includeCode, String codeControl ->
	task.outputs.dir(dumpDir)
	task.outputs.dir(resultsDir)
	task.doFirst {
		resetCodexGeneratedDir(dumpDir, 'prompt dump directory')
		resetCodexGeneratedDir(resultsDir, 'structural prompt-dump result directory')
	}
	task.environment 'ENIGMA_LLM_MODEL', ''
	task.environment 'ENIGMA_LLM_DUMP_PROMPTS', dumpDir.path
	if (includeCode) {
		task.environment 'ENIGMA_LLM_BENCH_CODE', 'true'
	}
	if (codeControl != null) {
		task.environment 'ENIGMA_LLM_BENCH_CODE_CONTROL', codeControl
	}
	if (project.hasProperty('maxPromptChars')) {
		task.environment 'ENIGMA_LLM_MAX_PROMPT_CHARS', project.property('maxPromptChars')
	}
}

[
		[name: 'M', includeCode: false, codeControl: null],
		[name: 'MC', includeCode: true, codeControl: null],
		[name: 'MPP', includeCode: true, codeControl: 'sterile'],
].each { arm ->
	tasks.register("dumpCodexObscurePrompts${arm.name}", JavaExec) {
		group = 'verification'
		description = "Dumps offline obscure-corpus prompts for the Codex ${arm.name} arm."
		dependsOn 'obfuscateCorpus'
		classpath = sourceSets.main.runtimeClasspath
		mainClass = 'cuchaz.enigma.llm.LlmObfuscationBenchmarkHarness'

		def dumpDir = new File(codexPromptDumpRoot, "obscure_${arm.name}")
		def resultsDir = new File(codexPromptDumpRoot, "obscure_${arm.name}_structural")
		args = [
				file("${project.buildDir}/llm-evaluation/obfuscated").path,
				resultsDir.path
		]
		configureCodexPromptDump(delegate, dumpDir, resultsDir, arm.includeCode, arm.codeControl)
	}

	tasks.register("dumpCodexMinecraftPrompts${arm.name}", JavaExec) {
		group = 'verification'
		description = "Dumps offline Minecraft prompts for the Codex ${arm.name} arm."
		dependsOn 'buildMinecraftCorpus'
		classpath = sourceSets.main.runtimeClasspath
		mainClass = 'cuchaz.enigma.llm.LlmObfuscationBenchmarkHarness'

		def profile = (project.findProperty('mcProfile') ?: 'union').toString().toLowerCase(Locale.ROOT)
		if (!['yarn', 'mojmap', 'union'].contains(profile)) {
			throw new GradleException("mcProfile must be one of yarn, mojmap, union; got ${profile}")
		}

		def dumpDir = new File(codexPromptDumpRoot, "mc_${arm.name}")
		def resultsDir = new File(codexPromptDumpRoot, "mc_${arm.name}_structural")
		args = [
				file("${project.buildDir}/llm-evaluation/minecraft/${profile}").path,
				resultsDir.path
		]
		configureCodexPromptDump(delegate, dumpDir, resultsDir, arm.includeCode, arm.codeControl)
	}
}

tasks.register('prepareCodexPromptBatches', Exec) {
	group = 'verification'
	description = 'Builds paired M/M+C/M++ prompt batches for Codex/Fable replay from offline benchmark dumps.'
	dependsOn 'dumpCodexObscurePromptsM', 'dumpCodexObscurePromptsMC', 'dumpCodexObscurePromptsMPP',
			'dumpCodexMinecraftPromptsM', 'dumpCodexMinecraftPromptsMC', 'dumpCodexMinecraftPromptsMPP'

	def scriptArg = file("${project.projectDir}/evaluation/prepare_codex_prompt_batches.py")
	def pythonArg = project.findProperty('codexPython') ?: 'python3'

	outputs.dir(codexPromptBatchRoot)
	doFirst {
		resetCodexGeneratedDir(codexPromptBatchRoot, 'filtered prompt batch directory')
	}
	commandLine pythonArg,
			scriptArg.path,
			'--out', codexPromptBatchRoot.path,
			'--obscure-arm', "M=${new File(codexPromptDumpRoot, 'obscure_M').path}",
			'--obscure-arm', "MC=${new File(codexPromptDumpRoot, 'obscure_MC').path}",
			'--obscure-arm', "MPP=${new File(codexPromptDumpRoot, 'obscure_MPP').path}",
			'--mc-arm', "M=${new File(codexPromptDumpRoot, 'mc_M').path}",
			'--mc-arm', "MC=${new File(codexPromptDumpRoot, 'mc_MC').path}",
			'--mc-arm', "MPP=${new File(codexPromptDumpRoot, 'mc_MPP').path}"
}

tasks.register('runCodexPromptBatch', Exec) {
	group = 'verification'
	description = 'Runs dumped prompt JSONL batches through codex exec in a resumable, auditable layout.'
	if (!project.hasProperty('codexPromptRoot')) {
		dependsOn 'prepareCodexPromptBatches'
	}

	def promptRootArg = file(project.findProperty('codexPromptRoot') ?: "${project.buildDir}/llm-evaluation/prompt-batches")
	def outArg = file(project.findProperty('codexOut') ?: "${project.buildDir}/llm-evaluation/codex-prompt-batch")
	def scriptArg = file("${project.projectDir}/evaluation/run_codex_prompt_batch.py")
	def pythonArg = project.findProperty('codexPython') ?: 'python3'

	commandLine pythonArg,
			scriptArg.path,
			'--prompt-root', promptRootArg.path,
			'--out', outArg.path,
			'--model', (project.findProperty('codexModel') ?: 'gpt-5.6-sol').toString(),
			'--effort', (project.findProperty('codexEffort') ?: 'high').toString(),
			'--datasets', (project.findProperty('codexDatasets') ?: 'obscure=batch,mc=mc_batch').toString(),
			'--arms', (project.findProperty('codexArms') ?: 'M,MC,MPP').toString(),
			'--tracks', (project.findProperty('codexTracks') ?: 'realistic').toString(),
			'--kinds', (project.findProperty('codexKinds') ?: 'METHOD').toString(),
			'--parallel', (project.findProperty('codexParallel') ?: '2').toString(),
			'--limit', (project.findProperty('codexLimit') ?: '0').toString(),
			'--timeout-seconds', (project.findProperty('codexTimeoutSeconds') ?: '420').toString()

	if (project.hasProperty('codexNeutralCwd')) {
		args '--neutral-cwd', file(project.property('codexNeutralCwd')).path
	}
	if (project.hasProperty('codexSchema')) {
		args '--schema', file(project.property('codexSchema')).path
	}
	if (project.hasProperty('codexDryRun') && project.property('codexDryRun').toString().toBoolean()) {
		args '--dry-run'
	}
}

tasks.register('scoreCodexPromptBatch', Exec) {
	group = 'verification'
	description = 'Scores runCodexPromptBatch output directories with exact/normalized/usable and latency summaries.'

	def outArg = file(project.findProperty('codexOut') ?: "${project.buildDir}/llm-evaluation/codex-prompt-batch")
	def scriptArg = file("${project.projectDir}/evaluation/score_prompt_batch.py")
	def pythonArg = project.findProperty('codexPython') ?: 'python3'

	commandLine pythonArg, scriptArg.path, outArg.path
}


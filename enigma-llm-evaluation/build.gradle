tasks.register('checkEvaluationAnalysisScripts', Exec) {
	group = 'verification'
	description = 'Syntax-checks committed Python evaluation analysis/report scripts.'

	def pythonArg = project.findProperty('codexPython') ?: 'python3'
	commandLine ([pythonArg, '-m', 'py_compile'] + evaluationPythonScripts.collect { it.path })
}

def evaluationReportTasks = []
def registerEvaluationReportTask = { String taskName, String mode, String taskDescription ->
	evaluationReportTasks << taskName
	tasks.register(taskName, Exec) {
		group = 'verification'
		description = taskDescription
		dependsOn 'checkEvaluationAnalysisScripts'

		def resamplesArg = (project.findProperty('reportResamples') ?: '5000').toString()
		def pythonArg = project.findProperty('codexPython') ?: 'python3'
		def scriptArg = file("${project.projectDir}/evaluation/write_evaluation_reports.py")

		commandLine pythonArg, scriptArg.path, '--only', mode, '--resamples', resamplesArg
		if (project.hasProperty('reportOut')) {
			args '--out', file(project.property('reportOut')).path
		}
		if (project.hasProperty('reportOverwrite') && project.property('reportOverwrite').toString().toBoolean()) {
			args '--overwrite'
		}
		if (project.hasProperty('reportDryRun') && project.property('reportDryRun').toString().toBoolean()) {
			args '--dry-run'
		}
	}
}

registerEvaluationReportTask(
		'writeMainBenchmarkReport',
